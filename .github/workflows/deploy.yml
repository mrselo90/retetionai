name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    
    steps:
      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Abort on the first failing command. This lives in the script rather
            # than the action's `script_stop` input, which exists in v1.0.3 but
            # not in v1.2.5 — relying on it meant a version bump could silently
            # drop the guard. Without it the script runs to the end regardless,
            # so a failed `pnpm build` still reaches the PM2 restart and puts the
            # services on a half-written .next: pages answer 200 from SSR while
            # the client chunks 404, which looks healthy from outside.
            set -e

            echo "🔑 Connected. Starting deploy script..."
            # Deliberately not `env` — this repo is public and its logs with it.
            echo "   shell=$0 bash=${BASH_VERSION:-none} psql=$(command -v psql || echo none)"
            echo "   DATABASE_URL=${DATABASE_URL:+set}${DATABASE_URL:-unset}"

            # Load nvm if it is installed. Written as an `if` rather than
            # `[ -s ... ] && . ...` on purpose: nvm is NOT installed on this
            # server (node and pnpm come from /usr/bin), so that AND-list
            # evaluated false and returned 1. Under script_stop's `set -e` the
            # whole deploy died on this line, before the first echo — a failure
            # with no output at all, which is very hard to read from the logs.
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi
            
            # Load PNPM
            export PNPM_HOME="/root/.local/share/pnpm"
            export PATH="$PNPM_HOME:$PATH"
            
            echo "🚀 Starting automated deployment..."
            
            cd /root/retetionai
            
            # Remember what is running before we move the tree. The rollback
            # below needs the exact commit whose build is live — `HEAD~1` after
            # the pull is not it: a deploy often brings several commits, so
            # HEAD~1 can still be ahead of what was deployed.
            DEPLOYED_SHA=$(git rev-parse HEAD)
            echo "   currently deployed: $DEPLOYED_SHA"

            echo "📦 Pulling latest code..."
            git pull origin main
            
            echo "📥 Installing dependencies..."
            pnpm install

            # Supabase migrations are NOT run here. DATABASE_URL is not passed into
            # this SSH session, so the step could only ever take its skip branch —
            # and it was the point every deploy died at, killing the run before the
            # build. Run them deliberately instead:
            #   DATABASE_URL="postgres://..." ./supabase/run-migrations.sh
            # If you want them back in CI, pass DATABASE_URL through the action's
            # `envs` input rather than hoping the shell already has it.

            echo "🗄️ Syncing Shopify shell Prisma schema..."
            pnpm --filter @recete/shopify-app prisma db push
            echo "✔ prisma step done"
            
            echo "🔨 Building the application..."
            pnpm build
            
            # Reload from ecosystem.config.cjs rather than `pm2 restart all`.
            # Two reasons: this PM2 instance also runs unrelated projects
            # (matchcountdown, eralp-*), and `all` bounced those on every deploy —
            # once even starting one that had been deliberately stopped. And per
            # DEPLOY_INSTRUCTIONS.md, a plain restart reuses PM2's saved process
            # definitions, which can keep stale ports and env and break routing.
            # The config names exactly Recete's four services, so the scope stays
            # correct without a list to keep in sync here.
            # Output redirected and stdin closed on purpose. The action was
            # reporting "Process exited with status 1" mid-stream — its own line
            # appeared in the log BEFORE output the script printed afterwards, so
            # the session was being torn down while the script still ran. pm2
            # holding the channel is the usual cause; keeping it off our stdio
            # lets the session close cleanly.
            echo "🔄 Restarting PM2 services..."
            pm2 startOrRestart ecosystem.config.cjs --update-env </dev/null >/dev/null 2>&1
            echo "✔ pm2 restart issued"
            
            echo "⏳ Waiting for services to start..."
            sleep 10
            
            # Check the web app as well as the API. The failure this pipeline
            # most needs to catch is a bad web build, and that presents as a
            # perfectly healthy API: SSR still answers 200 while the client
            # chunks 404. Checking only :3002 would wave it straight through.
            echo "🏥 Running post-deploy health check..."
            API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 http://localhost:3002/health || echo "000")
            WEB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 http://localhost:3001/ || echo "000")
            echo "   api=$API_STATUS web=$WEB_STATUS"

            if [ "$API_STATUS" != "200" ] || [ "$WEB_STATUS" != "200" ]; then
              echo "❌ Health check failed (api=$API_STATUS web=$WEB_STATUS). Rolling back to $DEPLOYED_SHA..."

              # `git reset --hard`, not `git checkout HEAD~1`: checkout leaves the
              # server on a detached HEAD, and then every later `git pull origin
              # main` fails with "not currently on any branch" — one bad deploy
              # would wedge the pipeline until someone fixed it by hand. reset
              # stays on main and lands exactly on the commit that was live.
              #
              # set +e for the duration: with -e a failure part-way through the
              # rollback would abort before the restart, leaving the services on
              # the broken build — the opposite of what a rollback is for.
              set +e
              git reset --hard "$DEPLOYED_SHA"
              pnpm install
              if pnpm build; then
                pm2 startOrRestart ecosystem.config.cjs --update-env </dev/null >/dev/null 2>&1
                echo "🔙 Rolled back to $DEPLOYED_SHA and restarted"
              else
                echo "🚨 Rollback BUILD FAILED. The tree is back on $DEPLOYED_SHA but"
                echo "   .next is not rebuilt, so the services are still serving the"
                echo "   bad build. Fix by hand, from /root/retetionai:"
                echo "   pnpm install && pnpm build && pm2 startOrRestart ecosystem.config.cjs --update-env"
              fi
              set -e
              exit 1
            fi
            
            echo "🔒 Verifying HTTPS endpoint..."
            HTTPS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://recete.co.uk/health 2>/dev/null || echo "000")
            echo "   HTTPS_STATUS=$HTTPS_STATUS"
            if [ "$HTTPS_STATUS" != "200" ]; then
              echo "⚠️  HTTPS health check returned HTTP $HTTPS_STATUS (may be OK if DNS/cert not yet configured)"
            else
              echo "✅ HTTPS endpoint healthy"
            fi

            echo "✅ Deployment completed successfully! Health check passed."

            # Explicit success. Every step above is guarded by script_stop's
            # `set -e`, so reaching this line means they all passed — but the run
            # was still reported as failed, with the log's tail cut off after the
            # HTTPS echo and nothing identifiably returning non-zero. Rather than
            # let a stray status from the last construct fail a deploy that
            # demonstrably worked (server on the right commit, rebuilt, all four
            # services online), say so explicitly. This cannot mask an earlier
            # failure: set -e aborts before ever getting here.
            exit 0
