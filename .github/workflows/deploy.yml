name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    
    steps:
      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Abort on the first failing command. Without this the script runs to
          # the end regardless, so a failed `pnpm build` still reached the PM2
          # restart and put the services on a half-written .next — pages answer
          # 200 from SSR while the client chunks 404, which looks healthy from
          # outside. Better to stop with the old build still serving.
          script_stop: true
          script: |
            echo "🔑 Connected. Starting deploy script..."

            # Load nvm if it is installed. Written as an `if` rather than
            # `[ -s ... ] && . ...` on purpose: nvm is NOT installed on this
            # server (node and pnpm come from /usr/bin), so that AND-list
            # evaluated false and returned 1. Under script_stop's `set -e` the
            # whole deploy died on this line, before the first echo — a failure
            # with no output at all, which is very hard to read from the logs.
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi
            
            # Load PNPM
            export PNPM_HOME="/root/.local/share/pnpm"
            export PATH="$PNPM_HOME:$PATH"
            
            echo "🚀 Starting automated deployment..."
            
            cd /root/retetionai
            
            echo "📦 Pulling latest code..."
            git pull origin main
            
            echo "📥 Installing dependencies..."
            pnpm install

            echo "🗄️ Running Supabase migrations..."
            if command -v psql &> /dev/null && [ -n "$DATABASE_URL" ]; then
              bash supabase/run-migrations.sh
            else
              echo "⚠️  psql not available or DATABASE_URL not set, skipping Supabase migrations"
            fi

            echo "🗄️ Syncing Shopify shell Prisma schema..."
            pnpm --filter @recete/shopify-app prisma db push
            
            echo "🔨 Building the application..."
            pnpm build
            
            # Reload from ecosystem.config.cjs rather than `pm2 restart all`.
            # Two reasons: this PM2 instance also runs unrelated projects
            # (matchcountdown, eralp-*), and `all` bounced those on every deploy —
            # once even starting one that had been deliberately stopped. And per
            # DEPLOY_INSTRUCTIONS.md, a plain restart reuses PM2's saved process
            # definitions, which can keep stale ports and env and break routing.
            # The config names exactly Recete's four services, so the scope stays
            # correct without a list to keep in sync here.
            echo "🔄 Restarting PM2 services..."
            pm2 startOrRestart ecosystem.config.cjs --update-env
            
            echo "⏳ Waiting for services to start..."
            sleep 10
            
            echo "🏥 Running post-deploy health check..."
            HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 http://localhost:3002/health || echo "000")
            if [ "$HEALTH_STATUS" != "200" ]; then
              echo "❌ Health check failed (HTTP $HEALTH_STATUS). Rolling back..."
              git checkout HEAD~1
              pnpm install
              pnpm build
              pm2 startOrRestart ecosystem.config.cjs --update-env
              echo "🔙 Rolled back to previous version"
              exit 1
            fi
            
            echo "🔒 Verifying HTTPS endpoint..."
            HTTPS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://recete.co.uk/health 2>/dev/null || echo "000")
            if [ "$HTTPS_STATUS" != "200" ]; then
              echo "⚠️  HTTPS health check returned HTTP $HTTPS_STATUS (may be OK if DNS/cert not yet configured)"
            else
              echo "✅ HTTPS endpoint healthy"
            fi

            echo "✅ Deployment completed successfully! Health check passed."
